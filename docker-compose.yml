services:
  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: bageshwari_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bageshwari_b2b
      MYSQL_USER: admin
      MYSQL_PASSWORD: quantumSql@123
      MYSQL_ROOT_PASSWORD: quantumSql@123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "admin", "-pquantumSql@123"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Next.js Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bageshwari_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "mysql://admin:quantumSql%40123@db:3306/bageshwari_b2b"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "simulcast-production-secret-bageshwari-2026-secure"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_PUBLIC_PLATFORM_NAME: "Bageshwari Tractors"
      SEED_PASSWORD: "ChangeMe-Bageshwari-2026!"
      NODE_ENV: "production"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
    driver: local
