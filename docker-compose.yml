services:
  app:
    build: .
    container_name: bageshwari-b2b
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3011"
      HOSTNAME: 0.0.0.0
      DATABASE_URL: "mysql://admin:quantumSql%40123@host.docker.internal:3306/bageshwari_b2b"
      SEED_PASSWORD: "quantumSql@123"
    ports:
      - "3011:3011"
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - app_uploads:/app/public/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3011/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  app_uploads:
