services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bageshwari_b2b_app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      DATABASE_HOST: ${DATABASE_HOST:-host.docker.internal}
      DATABASE_PORT: ${DATABASE_PORT:-3306}
      DATABASE_USER: ${DATABASE_USER:-admin}
      DATABASE_PASSWORD_FILE: /run/secrets/mysql_password
      DATABASE_NAME: ${DATABASE_NAME:-bageshwari_b2b}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-simulcast-production-secret-bageshwari-2026-secure}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_PLATFORM_NAME: ${NEXT_PUBLIC_PLATFORM_NAME:-Bageshwari Tractors}
      SEED_PASSWORD: ${SEED_PASSWORD:-ChangeMe-Bageshwari-2026!}
    ports:
      - "${PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    secrets:
      - mysql_password
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

secrets:
  mysql_password:
    file: ./secrets/mysql_password.txt
